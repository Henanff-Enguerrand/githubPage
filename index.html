<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vente de Téléphones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Boutique de Téléphones</h1>
    </header>
    <main>
        <section class="product" id="product-1">
            <img src="images/phone1.jpg" alt="Téléphone 1" />
            <h2>Téléphone 1</h2>
            <p class="price">399€</p>
            <button class="buy" data-id="1">Acheter</button>
        </section>
        <section class="product" id="product-2">
            <img src="images/phone2.jpg" alt="Téléphone 2" />
            <h2>Téléphone 2</h2>
            <p class="price">499€</p>
            <button class="buy" data-id="2">Acheter</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
